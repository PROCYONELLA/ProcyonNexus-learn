<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} — Procyon Learn</title>
<style>
  :root {
    --bg: #0e1116; --panel: #181c22; --border: #2a313a;
    --fg: #e6e9ee; --muted: #9aa4b2; --accent: #7dc4ff; --accent-soft: rgba(125,196,255,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 1.1rem; font-family: -apple-system, "SF Pro Text", "PingFang TC", system-ui, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.55; max-width: 880px; margin: 0 auto;
  }
  h1 { font-size: 1.45rem; margin: .2rem 0 1rem; }
  h1 .zh { color: var(--muted); font-weight: 400; font-size: .85em; margin-left: .4em; }
  .meta { color: var(--muted); font-size: .8rem; margin-bottom: 1.3rem; }
  .grid {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: .9rem; display: flex; flex-direction: column; gap: .55rem;
  }
  .card img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px;
    background: #000;
  }
  .card h3 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .card .zh { color: var(--muted); font-weight: 400; font-size: .9em; }
  .card p { margin: 0; color: var(--muted); font-size: .88rem; }
  .card .tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .2rem; }
  .tag { font-size: .7rem; padding: .1rem .45rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  button.speak {
    appearance: none; border: 1px solid var(--border); background: transparent; color: var(--accent);
    border-radius: 999px; padding: .15rem .55rem; font-size: .85rem; cursor: pointer;
    transition: background .15s;
  }
  button.speak:hover, button.speak:active { background: var(--accent-soft); }
  .word-list { display: flex; flex-direction: column; gap: .6rem; margin: 1rem 0; }
  .word {
    display: flex; align-items: baseline; gap: .6rem; padding: .7rem .9rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  .word .term { font-weight: 600; font-size: 1.05rem; }
  .word .gloss { color: var(--muted); font-size: .88rem; }
  .register-casual { color: #6ddc8a; }
  .register-neutral { color: #e0c46c; }
  .register-formal { color: #f08585; }
  footer { color: var(--muted); font-size: .75rem; margin-top: 2rem; text-align: center; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de; --fg: #1f2328; --muted: #57606a; --accent: #0969da; --accent-soft: rgba(9,105,218,0.1); }
  }
</style>
</head>
<body>

<h1>{{TITLE}}<span class="zh">{{TITLE_ZH}}</span></h1>
<div class="meta">{{META}} · Tap 🔊 to hear pronunciation</div>

<!-- ============ WORD LIST PATTERN (language topics) ============ -->
<!-- Repeat .word blocks for each item -->
<div class="word-list">
  <div class="word">
    <span class="term">chur bro</span>
    <button class="speak" onclick="speak('chur bro','en-NZ')">🔊</button>
    <span class="register-casual">🟢 casual</span>
    <span class="gloss">— NZ 男性間說「謝啦」；對長輩/工作場合不用</span>
  </div>
</div>

<!-- ============ COMPARISON GRID PATTERN (species / drug / image) ============ -->
<!-- Repeat .card blocks for each item to compare -->
<div class="grid">
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/PLACEHOLDER.jpg/640px-PLACEHOLDER.jpg" alt="...">
    <h3>Snapper <span class="zh">嘉鱲</span>
        <button class="speak" onclick="speak('snapper')">🔊</button></h3>
    <p>粉紅體色、藍點散布；NZ 北島最常見的休閒釣魚目標。</p>
    <div class="tags"><span class="tag">Sparidae</span><span class="tag">NZ</span></div>
  </div>
</div>

<footer>
  Generated by <a href="https://github.com/PROCYONELLA/ProcyonNexus">/learn</a> · {{DATE}}
</footer>

<script>
  // Web Speech API — uses system voices.
  // Lang codes: en-NZ / en-GB / en-US / en-AU / ja-JP / zh-TW / zh-CN / es-ES / fr-FR
  function speak(text, lang = 'en-US', rate = 0.92) {
    try {
      window.speechSynthesis.cancel(); // stop any in-progress utterance
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate;
      // Prefer a voice matching the requested locale if available
      const voices = window.speechSynthesis.getVoices();
      const match = voices.find(v => v.lang.toLowerCase().startsWith(lang.toLowerCase()))
                  || voices.find(v => v.lang.toLowerCase().startsWith(lang.split('-')[0]));
      if (match) u.voice = match;
      window.speechSynthesis.speak(u);
    } catch (e) { console.warn('TTS unavailable', e); }
  }
  // iOS Safari loads voices async — refresh once they're ready
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.onvoiceschanged = () => {};
  }
</script>
</body>
</html>
